services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbspot_app
    ports:
      - "${PORT:-3008}:${PORT:-3008}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:15-alpine
    container_name: dbspot_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Jakarta
      - PGTZ=Asia/Jakarta
    ports:
      - "5435:5432"
    volumes:
      - dbspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  dbspot_pgdata:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbspot_app
    ports:
      - "${PORT:-3008}:${PORT:-3008}"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - PORT=${PORT:-3008}
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NO_DB=${NO_DB:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  db:
    image: postgres:15-alpine
    container_name: dbspot_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dbspot}
      - TZ=Asia/Jakarta
      - PGTZ=Asia/Jakarta
    ports:
      - "5435:5432"
    volumes:
      - dbspot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbspot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  dbspot_pgdata:
